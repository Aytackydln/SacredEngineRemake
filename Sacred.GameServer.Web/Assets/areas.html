<main class="ae"><div class="side"><section class="card"><h2>Tools</h2><div class="tools"><button type="button" data-tool="pan" aria-pressed="true">Move</button><button type="button" data-tool="paint">Paint</button><button type="button" data-tool="erase">Erase</button><button type="button" data-tool="rectadd">Rect +</button><button type="button" data-tool="rectdel">Rect &minus;</button><button type="button" data-tool="circle">Circle</button><button type="button" id="fit">Fit</button></div><p class="hint" id="toolhint"></p></section><section class="card"><h2>Areas</h2><ul class="areas" id="areas"></ul><div class="row" style="margin-top:.6rem"><input type="text" id="newName" maxlength="40" placeholder="New area, e.g. Silver Creek" autocomplete="off"><button type="button" class="primary" id="new">Create</button></div></section><section class="card" id="detail" hidden><h2>Selected area</h2><div class="row"><input type="text" id="name" maxlength="40" aria-label="Name"></div><div class="row" style="margin-top:.4rem"><label for="near">Plus neighbours within</label><input type="number" id="near" min="0" max="3" value="0"><span class="hint">cells</span></div><p class="hint" id="info"></p><div class="row"><button type="button" id="zoomArea">Zoom to it</button><button type="button" id="circleOff" hidden>Remove circle</button><button type="button" id="clear">Clear</button><button type="button" id="delete">Delete</button></div><p class="hint" style="margin-top:.6rem">Config line for <code>world_events.lua</code>:</p><textarea class="snip" id="snip" readonly></textarea><div class="row"><button type="button" id="copy">Copy snippet</button></div></section><section class="card"><div class="row"><button type="button" class="primary" id="save" disabled>Save to the server</button></div><p class="status" id="status" aria-live="polite"></p><p class="hint">Saved areas go into the <code>world_events</code> mod's storage (key <code>areas</code>) and win over an area of the same id in the script file. Events use them by id.</p></section></div><div class="stage"><canvas id="cv" aria-label="World map with the sector grid"></canvas><p class="status" id="loading" style="position:absolute;top:.6rem;left:.8rem;margin:0;color:#efe6d6">Loading the map...</p><div class="readout" id="readout"></div></div></main>
