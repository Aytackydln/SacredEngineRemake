name: Publish Projects on Tag

on:
  push:
    tags:
      - 'v*.*.*'  # Adjust pattern as needed (e.g., v* or *)

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create releases and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (adjust version if needed)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # Change according to your projects

      - name: Extract version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ==================== SacredEngineRemake ====================
      - name: Publish Project1
        shell: bash
        run: |
          dotnet publish SacredEngineRemake/SacredEngineRemake.csproj \
            --configuration Release \
            --output ./publish/SacredEngineRemake \
            -p:Version=${{ env.VERSION }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -r win-x64

      # ==================== SacredItemSimulator.Avalonia ====================
      - name: Publish Project2
        shell: bash
        run: |
          dotnet publish SacredItemSimulator.Avalonia/SacredItemSimulator.Avalonia.csproj \
            --configuration Release \
            --output ./publish/SacredItemSimulator.Avalonia \
            -p:Version=${{ env.VERSION }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -r win-x64

      # Attach to GitHub Release (if triggered by tag)
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          files: |
            ./publish/SacredEngineRemake/SacredEngineRemake.exe
            ./publish/SacredItemSimulator.Avalonia/SacredItemSimulator.Avalonia.exe
          tag_name: ${{ github.ref_name }}
          allow_override: true
