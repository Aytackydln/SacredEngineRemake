name: Publish Projects on Tag

on:
  push:
    tags:
      - 'v*.*.*'  # Adjust pattern as needed (e.g., v* or *)

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create releases and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (adjust version if needed)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # Change according to your projects

      - name: Extract version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ==================== SacredEngineRemake ====================
      - name: Publish SacredEngineRemake
        shell: bash
        run: |
          dotnet publish SacredEngineRemake/SacredEngineRemake.csproj \
            --configuration Release \
            --output ./publish/SacredEngineRemake \
            -p:Version=${{ env.VERSION }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:StackTraceSupport=true \
            -p:DebugSymbols=true \
            -p:DebugType=portable \
            -p:StripSymbols=false \
            -r win-x64

      # ==================== Sacred.ItemViewer.Avalonia ====================
      - name: Publish Sacred.ItemViewer.Avalonia
        shell: bash
        run: |
          dotnet publish Sacred.ItemViewer.Avalonia/Sacred.ItemViewer.Avalonia.csproj \
            --configuration Release \
            --output ./publish/Sacred.ItemViewer.Avalonia \
            -p:Version=${{ env.VERSION }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:StackTraceSupport=true \
            -p:DebugSymbols=true \
            -p:DebugType=portable \
            -p:StripSymbols=false \
            -r win-x64

      # ==================== Sacred.World.Renderer.Terminal ====================
      - name: Publish Sacred.World.Renderer.Terminal
        shell: bash
        run: |
          dotnet publish Sacred.World.Renderer.Terminal/Sacred.World.Renderer.Terminal.csproj \
            --configuration Release \
            --output ./publish/Sacred.World.Renderer.Terminal \
            -p:Version=${{ env.VERSION }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:StackTraceSupport=true \
            -p:DebugSymbols=true \
            -p:DebugType=portable \
            -p:StripSymbols=false \
            -r win-x64

      - name: Package debug symbols
        shell: pwsh
        run: |
          foreach ($project in @('SacredEngineRemake', 'Sacred.ItemViewer.Avalonia', 'Sacred.World.Renderer.Terminal')) {
            Compress-Archive -Path "./publish/$project/*.pdb" -DestinationPath "./publish/$project-symbols.zip"
          }

      # Attach to GitHub Release (if triggered by tag)
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          files: |
            ./publish/SacredEngineRemake/SacredEngineRemake.exe
            ./publish/Sacred.ItemViewer.Avalonia/Sacred.ItemViewer.Avalonia.exe
            ./publish/Sacred.World.Renderer.Terminal/Sacred.World.Renderer.Terminal.exe
            ./publish/SacredEngineRemake/cimgui.dll
            ./publish/SacredEngineRemake-symbols.zip
            ./publish/Sacred.ItemViewer.Avalonia-symbols.zip
            ./publish/Sacred.World.Renderer.Terminal-symbols.zip
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          allow_override: true
